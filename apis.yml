  dns: api., docs., developer. and developers.acelerate.io do NOT resolve (no A record). Only acelerate.io, www.acelerate.io
    and app.acelerate.io resolve, all to the same Cloudflare anycast pair. Other subdomains known from archives
    -- staging., demo2., grafana., retool. -- are internal tooling, not API surfaces.
  openapi: 'miss -- /openapi.json, /openapi.yaml, /swagger.json, /api/v1/openapi.json, /api/v1/swagger.json, /api/docs,
    /api-docs, /api/v1/docs probed on app.acelerate.io (the API host named by the shipped bundle) and on the apex.
    Every one answered a Cloudflare bot challenge (HTTP 403, cf-mitigated: challenge) rather than an origin response,
    so no spec was confirmed either way from the live host; the shipped production bundle contains no "openapi",
    "swagger" or "api-docs" string, and the Next.js route manifest carries no docs or reference route.'
  graphql: miss -- no /graphql surface. The production bundle (749KB, build 3d72771) contains zero occurrences of
    "graphql" or "trpc"; the client is a plain REST consumer of its own backend.
  mcp: miss -- no hosted or local MCP server published, and no OpenAPI to derive a candidate tool list from.
  agent_card: miss -- /.well-known/agent-card.json and /.well-known/agent.json probed on all three resolving hosts;
    app.acelerate.io answers a genuine Next.js 404 (negative control also 404), the apex and www answer 301 to app.acelerate.io.
    No a2a/ artifact was written.
  wsdl: miss -- no ?wsdl / ?singleWsdl surface, no enterprise or integration section, nothing in any public repository.
  grpc: miss -- github.com/Acelerate exists as an Organization (created 2018-03-30) but publishes zero public repositories,
    and there is no buf.build presence. Ownership of that org is unproven, so no GitHubOrganization pointer is emitted.
  ogc: not applicable -- Acelerate is a restaurant purchasing and virtual-brand SaaS; no baseURL, docs link or prose
    points at a WMS/WFS/WCS/WMTS/CSW or OGC API surface, so no blind probing was done.
  packages: miss -- npm registry search for "acelerate" returns 0 packages, @acelerate scope is 404, pypi.org/pypi/acelerate/json
    is 404. No first-party SDK is published anywhere.
  private_backend: 'The production application DOES call a first-party REST backend: the shipped Next.js bundle
    sets API_URL_IN_BROWSER "https://app.acelerate.io/api/v1" and API_URL_IN_BROWSER_V2 "https://app.acelerate.io/api/v2"
    (with API_URL_IN_SERVER "http://api:3000" -- an in-cluster service name). This is the SPA''s own private backend:
    it has no documentation, no reference, no signup for developers and no published contract, so it is recorded
    here as evidence and is deliberately NOT registered as an apis[] entry or a baseURL. Registering it would credit
    Acelerate with an API product it does not sell.'
  app_surface: 'Routes enumerated from the 2026-02-16 production _buildManifest.js: /bank-accounts, /brands, /customers,
    /customers/feedback, /legal, /login, /logout, /menu-manager, /offers, /order-manager, /payments, /purchasing/distributors,
    /purchasing/invoices, /purchasing/rebates, /sales/orders, /sales/overview, /sales/storefronts, /settings, /signup,
    /terms-of-service. No /developers, /docs, /api-reference or /integrations route exists.'
  marketing_site: The Webflow marketing site on www.acelerate.io was retired; its last archived capture is 2023-10-04
    and it carried only /contact, /customers/restaurants and /customers/manufacturers -- no developer or API page.
    The apex has 301d into the authenticated app since at least 2025-01-27.
  pointer_liveness: 'Every common[] pointer was fetched 2026-09-06. LinkedIn 200 and the image 200. Website (301
    to app.acelerate.io), SignUp, Login and TermsOfService all return HTTP 403 with cf-mitigated: challenge -- a
