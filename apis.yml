aid: acelerate
name: Acelerate
description: Acelerate (acelerate.io) is a Santa Monica, California restaurant technology company founded in 2019
  by former DoorDash operator George Jacobs. It launched as a virtual-brand and host-kitchen platform that let existing
  restaurants run additional delivery-only brands out of their idle kitchen capacity, and raised a USD 14.44M Series
  A led by Sequoia Capital in July 2021. The product has since moved up the restaurant supply chain -- the production
  application at app.acelerate.io covers purchasing from distributors, invoices and rebates, supplier offers, a
  menu manager, an order manager, sales storefronts, payments and bank accounts. Acelerate publishes no public developer
  program - no developer portal, API reference, OpenAPI or other machine-readable contract, SDK, webhook catalog
  or MCP server - and the marketing site that once carried its brand and customer pages has been retired, with acelerate.io
  now redirecting straight into the authenticated application.
